<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#152c2a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="https://pyscript.net/releases/2026.7.3/core.css"
    >
    <script
      type="module"
      src="https://pyscript.net/releases/2026.7.3/core.js"
    ></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Student Showcase</title>
      <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <section id="creator" class="section pt-0">
      <div class="container">
        <div class="eyebrow">Meet The Creator</div>

        <div class="row g-4 mt-1 align-items-stretch">
          <div class="col-lg-7">
            <article class="project-card h-100">
              <h2 class="section-title">Sancho II Mercado</h2>
              <p>
                I love running, gaming, and traveling. Also, my biggest dream
                is to see the world. Favorite quote: “Don't stop believin.”
              </p>
            </article>
          </div>
        </div>
      </div>
    </section>

    <main class="section">
      <div class="container">
        <div
          class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"
        >
          <div>
            <div class="eyebrow">The assessment shelf</div>
            <h2 class="section-title mt-2 mb-0">Explore my work</h2>
          </div>
        </div>

        <div
          id="assessment-list"
          class="result row g-4"
          aria-live="polite"
        ></div>
      </div>
    </main>

    <script type="py" src="project.py"></script>
  </body>
</html>
